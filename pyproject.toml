[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reg2app"
version = "0.1.0"
description = "From Regulation to Program Behavior - Automated Evidence-Based Compliance Analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
